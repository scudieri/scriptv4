<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roteiro de recovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --ink:#16202A; --muted:#5B6773; --faint:#AEB8C2; --line:#D3D9DF;
  --yes:#1D6E55; --yes-bg:#E3F2EC; --no:#B3263A; --no-bg:#FBE8EB; --neutral-bg:#E4E9EE; --accent:#2A4C8C;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171D; --panel:#1A222B; --ink:#E7ECF1; --muted:#9AA6B2; --faint:#4A5765; --line:#2C3743;
    --yes:#6FD0AE; --yes-bg:#173329; --no:#F28A99; --no-bg:#3A1C22; --neutral-bg:#24303B; --accent:#8FB0EC; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171D; --panel:#1A222B; --ink:#E7ECF1; --muted:#9AA6B2; --faint:#4A5765; --line:#2C3743;
  --yes:#6FD0AE; --yes-bg:#173329; --no:#F28A99; --no-bg:#3A1C22; --neutral-bg:#24303B; --accent:#8FB0EC; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;font-weight:600;margin:4px 0 2px;letter-spacing:-0.01em}
.sub{margin:0 0 16px;font-size:14px;color:var(--muted)}
.lead{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.lead label{font-size:13px;color:var(--muted);display:block}
.lead input{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tool{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tool:disabled{opacity:.4;cursor:default}
.tool.away{margin-left:auto}
.node{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.node.past{padding:12px 16px;background:transparent}
.node.current{border-color:var(--accent);border-width:1.5px}
.phase{font-size:12px;color:var(--accent);font-weight:500;margin:0 0 4px}
.say{font-family:"Newsreader",Georgia,serif;font-size:22px;line-height:1.45;margin:0}
.past .say{font-size:16px;color:var(--muted)}
.say::before{content:"\201C"}.say::after{content:"\201D"}
.result{font-size:19px;font-weight:600;margin:0 0 6px}
.past .result{font-size:15px}
.result.ok{color:var(--yes)}.result.bad{color:var(--no)}.result.mid{color:var(--accent)}
.tip{margin:12px 0 0;font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.past .tip{display:none}
svg.wire{display:block;width:100%;height:26px;overflow:visible}
svg.wire path{fill:none;stroke-width:2;vector-effect:non-scaling-stroke}
.w-on{stroke:var(--accent)}.w-off{stroke:var(--faint);stroke-dasharray:4 4}.w-idle{stroke:var(--line)}
.branches{display:grid;gap:12px}
.branches.two{grid-template-columns:1fr 1fr}
.br{font:inherit;text-align:center;border-radius:10px;cursor:pointer;border:1.5px solid transparent;padding:10px 8px;background:var(--neutral-bg);color:var(--ink)}
.br .lbl{display:block;font-weight:600;font-size:15px}
.br .to{display:block;font-size:12px;opacity:.8;margin-top:2px}
.br.chosen.yes{background:var(--yes-bg);color:var(--yes);border-color:var(--yes)}
.br.chosen.no{background:var(--no-bg);color:var(--no);border-color:var(--no)}
.br.chosen{border-color:var(--accent)}
.br.other{background:transparent;border:1.5px dashed var(--faint);color:var(--muted)}
.br.other:hover{border-color:var(--accent);color:var(--ink)}
.live .br{font-size:18px;padding:14px 10px;min-height:60px}
.live .br:not(.yes):not(.no){background:var(--panel);border-color:var(--accent);color:var(--ink)}
.live .br .lbl{font-size:18px}
.live .br.yes{background:var(--yes-bg);color:var(--yes);border-color:var(--yes)}
.live .br.no{background:var(--no-bg);color:var(--no);border-color:var(--no)}
.br:focus-visible,.tool:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.summary{margin-top:14px}
.summary textarea{width:100%;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.cap{display:block;margin-top:14px;font-size:13px;font-weight:500;color:var(--accent)}
.cap textarea{display:block;width:100%;min-height:64px;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;font-weight:400;resize:vertical}
.cap textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{margin:8px 0 0;font-size:14px;color:var(--ink);background:var(--neutral-bg);border-radius:8px;padding:8px 10px}
.br .ex{display:block;font-family:"Newsreader",Georgia,serif;font-size:15px;font-weight:400;line-height:1.35;margin-top:6px;opacity:.85}
@media (max-width:520px){.live .branches.two.multi{grid-template-columns:1fr}}
.cap input.num{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-weight:400}
.cap input.num:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.reveal{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--yes-bg);color:var(--ink);font-size:19px}
.past .reveal{font-size:15px;padding:8px 12px}
.reveal::before,.reveal::after{content:none}
.modes{display:flex;gap:8px;margin-top:12px}
.tool.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.keys{font-size:12px;color:var(--muted);margin-top:24px}
@media (prefers-reduced-motion: no-preference){
  .grow{animation:grow .35s ease-out}
  @keyframes grow{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
}
@media (max-width:420px){.say{font-size:20px}.lead{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Roteiro de recovery</h1>
  <p class="sub">V4 Company, Oxicore</p>
  <div class="lead">
    <label>Nome do lead<input id="nome" autocomplete="off" placeholder="Ex.: Carlos"></label>
    <label>Empresa<input id="empresa" autocomplete="off" placeholder="Ex.: Loja Aurora"></label>

  </div>
  <div class="tools">
    <button class="tool" id="back">Voltar</button>
    <button class="tool" id="restart">Recomeçar</button>
    <button class="tool away" id="reception">Caiu na recepção</button>
    <button class="tool" id="noanswer">Não atendeu</button>
  </div>
  <div id="tree" aria-live="polite"></div>
  <p class="keys">Atalhos: S para sim, N para não, 1 a 4 nas opções múltiplas, Enter para continuar e ← para voltar (fora dos campos de texto). Toque num caminho tracejado para trocar a resposta naquele ponto.</p>
</main>
<script>
const N = {
  abertura:{"p": "abertura", "say": "Opa, falo com o {nome}?", "tip": "Pausa. Espere ele confirmar antes de seguir.", "o": [["É ele", "apresenta", "yes"], ["Não é ele", "portaria", "no"]]},
  apresenta:{"p": "abertura", "say": "Olá, {nome}, aqui é o Paulo, da V4. Tudo bem?", "tip": "Pausa de novo. Deixe ele responder, não emende a próxima fala.", "o": [["Respondeu", "contexto"]]},
  contexto:{"p": "abertura", "say": "Te liguei porque um tempo atrás você conversou com a nossa equipe sobre as vendas da {empresa}. Lembra?", "tip": "Fale o nome da empresa dele. Isso mostra que a ligação não é aleatória.", "o": [["Lembra", "gancho", "yes"], ["Não lembra", "contexto2", "no"], ["Já falou várias vezes", "saturado", ""], ["Não pode falar agora", "ocupado", ""]]},
  contexto2:{"p": "abertura", "say": "Normal, faz um tempinho. Foi uma conversa sobre as vendas da {empresa}, e eu tô retomando justamente os casos que ficaram no meio do caminho.", "o": [["Continuar", "gancho"]]},
  portaria:{"p": "abertura", "etapa": "Recepção", "say": "Oi! Aqui é o Paulo, coordenador de receitas da V4. É sobre uma conversa que o {nome} teve com a gente sobre vendas. Ele tá por aí?", "tip": "Seja direto e natural. Recepção filtra quem parece vendedor.", "o": [["Transferiu", "abertura", "yes"], ["Não transferiu", "fim_recepcao", "no"]]},
  saturado:{"p": "abertura", "say": "Justamente por isso quem tá ligando sou eu, e não mais um vendedor. Me dá 30 segundos: se não fizer sentido, eu mesmo tiro seu nome. Fechado?", "tip": "Não se desculpe. Dê um motivo e uma saída que você controla.", "o": [["Deu os 30 segundos", "gancho", "yes"], ["Insistiu em sair", "fim_remover", "no"]]},
  ocupado:{"p": "abertura", "say": "Entendo. É rápido: em 3 minutos eu te mostro se faz sentido ou não, e se não fizer você me fala na hora. Pode ser agora?", "tip": "Tente resolver agora. Retorno marcado pra depois costuma virar bolo.", "o": [["Topou agora", "gancho", "yes"], ["Realmente não dá", "ocupado2", "no"], ["Só ano que vem", "anoquevem", ""]]},
  ocupado2:{"p": "abertura", "say": "Fechado. Te ligo hoje às [hora] ou daqui a uma hora? Já te mando no WhatsApp pra ficar marcado.", "tip": "Retorno no mesmo dia. Quanto mais longe, maior o risco de sumir.", "o": [["Escolheu horário", "fim_retorno", "yes"], ["Não quer", "saturado", "no"]]},
  anoquevem:{"p": "abertura", "say": "Faz sentido. E o que tá tomando o seu tempo nesse fim de ano?", "tip": "O motivo dele costuma ser a dor. Pergunte antes de aceitar a data.", "o": [["Contou o motivo", "anoquevem2", ""]]},
  anoquevem2:{"p": "abertura", "say": "Entendi. Então vamos deixar o plano pronto pra virada, a gente tem tido bastante resultado com empresas como a {empresa}. Te ligo dia [dia] de janeiro às [hora], pode ser?", "o": [["Marcou data", "fim_retorno", "yes"], ["Recusou", "desq", "no"]]},
  rescisao:{"p": "diagnostico", "say": "E se eu te mostrar quantas vendas vocês precisam pra valer a troca, já contando a rescisão do contrato atual? Pra isso, preciso entender rapidinho o cenário de vocês.", "tip": "Não ataque a outra agência. Mostre a conta.", "o": [["Continuar", "q_ineficiencia"]]},
  concorrente:{"p": "diagnostico", "say": "Legal! Há quanto tempo vocês estão com eles, e o resultado tá onde vocês esperavam?", "o": [["Abaixo do esperado", "rescisao", "no"], ["Tá bom", "fim_contrato", "yes"], ["Não sabe dizer", "naodecisor", ""]]},
  naodecisor:{"p": "diagnostico", "say": "Entendi. E quem aí decide sobre vendas e marketing? Me passa o contato que eu mostro o plano direto pra ele, e você participa se quiser.", "tip": "Não faça diagnóstico com quem não decide. Seu objetivo é chegar no decisor.", "o": [["Passou o contato", "fim_decisor", "yes"], ["Quer levar ele mesmo", "plano_dono", ""], ["Não quis passar", "plano_dono", "no"]]},
  plano_dono:{"p": "diagnostico", "say": "Perfeito. Então vamos marcar já uma conversa de 30 minutos com ele, e você junto. Fica melhor [dia] às [hora] ou [dia] às [hora]?", "tip": "O próximo passo fica com você, não com o lead.", "o": [["Marcou com o dono", "confirmar", "yes"], ["Vai levar sozinho", "fim_wpp", "no"]]},
  reestrutura:{"p": "diagnostico", "say": "Reestruturando o quê, exatamente? E o que fez vocês decidirem mexer nisso agora?", "tip": "Algo vago como reestruturação ou turbulência é dor. Aprofunde antes de seguir.", "o": [["Pra investir em marketing depois", "reestrutura2", ""], ["Problema no time ou processo", "q_estrategia", ""]]},
  reestrutura2:{"p": "diagnostico", "say": "Então é o melhor momento: dá pra estrutura já nascer com o plano de vendas, em vez de arrumar e depois descobrir o que falta. Me conta rapidinho o cenário de hoje.", "o": [["Topou seguir", "q_estrategia", "yes"], ["Quer esperar", "ocupado", "no"]]},
  gancho:{"p": "diagnostico", "say": "Desde aquela conversa, o que vocês mudaram pra vender mais?", "tip": "Escute. Quando aparecer algo vago, pergunte “o quê, exatamente?” antes de seguir.", "o": [["Mudaram algo", "fez", "yes"], ["Nada ainda", "podevender", "no"], ["Fechou com outra agência", "concorrente", ""], ["Tá reestruturando", "reestrutura", ""]]},
  fez:{"p": "diagnostico", "say": "E o que isso trouxe de resultado até agora?", "o": [["Resultado bom", "demanda", "yes"], ["Abaixo do esperado", "q_ineficiencia", "no"]]},
  demanda:{"p": "diagnostico", "say": "Boa! E se amanhã entrasse o dobro de clientes, o que travaria primeiro?", "o": [["Nada travaria", "q_estrategia", "yes"], ["Algo travaria", "qual1", "no"]]},
  podevender:{"p": "diagnostico", "say": "Com a estrutura que vocês já têm, quanto a mais você acha que dá pra vender?", "o": [["Dá pra vender mais", "q_estrategia", "yes"], ["Já tá no limite", "qual1", "no"]]},
  qual1:{"p": "diagnostico", "say": "Hoje, quantos clientes entram por mês e qual o ticket médio?", "cap": "Clientes/mês e ticket médio", "o": [["Continuar", "qual2"]]},
  qual2:{"p": "diagnostico", "say": "Entre os clientes de hoje, quais são os que mais deixam dinheiro?", "o": [["Tem um perfil que paga mais", "qual3", "yes"], ["Todos são parecidos", "desq", "no"]]},
  qual3:{"p": "diagnostico", "say": "Se a maioria dos clientes fosse desse perfil, como ficaria o faturamento?", "o": [["Cresceria", "qual4", "yes"], ["Ficaria igual", "desq", "no"]]},
  qual4:{"p": "diagnostico", "say": "O que vocês fazem hoje pra atrair mais clientes assim?", "o": [["Tem uma ação", "qual5", "yes"], ["Nada específico", "q_estrategia", "no"]]},
  qual5:{"p": "diagnostico", "say": "E quanto essa ação tem trazido?", "o": [["Tá funcionando", "desq", "yes"], ["Abaixo do esperado", "q_ineficiencia", "no"]]},
  q_ineficiencia:{p:"diagnostico",res:["Qualificado: investimento sem retorno","ok"],dor:"o retorno do investimento que vocês já fazem",o:[["Aprofundar a dor","canal"]]},
  q_estrategia:{p:"diagnostico",res:["Qualificado: falta de estratégia de crescimento","ok"],dor:"uma estratégia pra vender mais e melhor",o:[["Aprofundar a dor","canal"]]},
  canal:{"p": "dor", "etapa": "Raio-x", "say": "Me conta: hoje, como vocês geram cliente novo? Tem tráfego pago rodando?", "tip": "Ouça o lead e escolha o que mais se parece com a fala dele.", "o": [["Tem tráfego pago", "quem", "", {"canal": "tráfego pago"}], ["Parou o tráfego", "@implNode", "", {"canal": "parou o tráfego", "dorEsc": "ter parado o tráfego depois de investir sem retorno", "implNode": "i_parou", "necNode": "i_nec"}], ["Só indicação", "@implNode", "", {"canal": "indicação", "dorEsc": "depender de indicação", "implNode": "e_ind", "necNode": "e_nec"}], ["Orgânico / redes", "@implNode", "", {"canal": "orgânico", "dorEsc": "depender só do orgânico", "implNode": "e_proc", "necNode": "e_nec"}], ["Prospecção ativa", "@implNode", "", {"canal": "prospecção ativa", "dorEsc": "depender de prospecção manual", "implNode": "e_time", "necNode": "e_nec"}]]},
  quem:{"p": "dor", "etapa": "Raio-x", "say": "Legal. E quem cuida desse tráfego hoje?", "o": [["Agência", "volume", "", {"gestor": "agência"}], ["Gestor interno", "volume", "", {"gestor": "gestor interno"}], ["O próprio dono", "volume", "", {"gestor": "o próprio dono"}]]},
  volume:{"p": "dor", "etapa": "Raio-x", "say": "E como tá o volume de lead chegando por mês?", "o": [["Bastante lead", "conversao", "", {}], ["Pouco lead", "@implNode", "", {"dorEsc": "pouco lead pro que vocês investem", "implNode": "i_vol", "necNode": "i_nec"}], ["Oscila muito", "@implNode", "", {"dorEsc": "lead oscilando muito", "implNode": "e_proc", "necNode": "i_nec"}]]},
  conversao:{"p": "dor", "etapa": "Raio-x", "say": "Boa! E desses leads, quantos acabam virando cliente?", "o": [["Converte bem", "@implNode", "", {"dorEsc": "não conseguir escalar o que já funciona", "implNode": "i_escala", "necNode": "i_nec"}], ["Converte pouco", "motivo", "", {}]]},
  motivo:{"p": "dor", "etapa": "Raio-x", "say": "Na sua visão, por que esses leads não fecham?", "o": [["Lead sem perfil", "@implNode", "", {"dorEsc": "lead desqualificado chegando", "implNode": "i_qual", "necNode": "i_nec"}], ["Demora pra responder", "@implNode", "", {"dorEsc": "demora pra atender os leads", "implNode": "e_time", "necNode": "i_nec"}], ["Comercial não fecha", "@implNode", "", {"dorEsc": "o comercial não convertendo os leads", "implNode": "i_conv", "necNode": "i_nec"}], ["Briga por preço", "@implNode", "", {"dorEsc": "lead chegando só preocupado com preço", "implNode": "e_perfil", "necNode": "i_nec"}]]},

  i_vol:{"p": "dor", "etapa": "Implicação", "say": "Com o volume de lead de hoje, quanto da meta vocês conseguem bater?", "o": [["Meta não bate", "custo", "", {"impl": "deixando a meta sempre pra trás"}], ["Custo por cliente alto", "custo", "", {"impl": "encarecendo cada cliente"}], ["Time comercial ocioso", "custo", "", {"impl": "deixando o time comercial ocioso"}]], "tip": "Deixe o lead contar a consequência com as palavras dele."},
  i_qual:{"p": "dor", "etapa": "Implicação", "say": "De cada 10 que chegam, quantos compram de verdade? E o resto, quanto do tempo do comercial isso toma?", "o": [["Time perde tempo", "custo", "", {"impl": "fazendo o time perder tempo com quem não compra"}], ["Custo por venda alto", "custo", "", {"impl": "encarecendo cada venda"}], ["Time desmotivado", "custo", "", {"impl": "desmotivando o time"}]], "tip": "Deixe o lead contar a consequência com as palavras dele."},
  i_conv:{"p": "dor", "etapa": "Implicação", "say": "E o lead que não fecha na hora, o que acontece com ele depois?", "o": [["Investimento jogado fora", "custo", "", {"impl": "jogando investimento fora"}], ["Ficam sem follow-up", "custo", "", {"impl": "deixando oportunidade esfriar sem follow-up"}], ["Ciclo de venda longo", "custo", "", {"impl": "alongando o ciclo de venda"}]], "tip": "Deixe o lead contar a consequência com as palavras dele."},
  e_ind:{"p": "dor", "etapa": "Implicação", "say": "E nos meses em que a indicação cai, o que acontece com o faturamento?", "o": [["Caixa aperta", "custo", "", {"impl": "deixando o caixa instável"}], ["Não consegue planejar", "custo", "", {"impl": "travando o planejamento de crescimento"}], ["Refém de poucos clientes", "custo", "", {"impl": "deixando vocês reféns de poucos clientes"}]], "tip": "Deixe o lead contar a consequência com as palavras dele."},
  e_proc:{"p": "dor", "etapa": "Implicação", "say": "Quão previsível é o resultado do marketing de um mês pro outro?", "o": [["Resultado oscila", "custo", "", {"impl": "fazendo o resultado oscilar mês a mês"}], ["Não sabe o que funciona", "custo", "", {"impl": "deixando vocês sem saber o que funciona"}], ["Dinheiro sem retorno", "custo", "", {"impl": "fazendo dinheiro ir embora sem retorno"}]], "tip": "Deixe o lead contar a consequência com as palavras dele."},

function num(t){if(!t)return NaN;t=String(t).toLowerCase().replace(/r\$|\s/g,"");let mult=1;if(/(milh[aã]o|milh[oõ]es|mi|mm)$/.test(t)){mult=1e6;t=t.replace(/(milh[aã]o|milh[oõ]es|mi|mm)$/,"");}else if(/(mil|k)$/.test(t)){mult=1000;t=t.replace(/(mil|k)$/,"");}if(/,\d{1,2}$/.test(t))t=t.replace(/\./g,"").replace(",",".");else t=t.replace(/[.,]/g,"");const n=parseFloat(t)*mult;return isFinite(n)?n:NaN;}
function mesa(v){if(v.calcMode==="ven"){const a=num(v.ven),b=num(v.vpot),t=num(v.tic);return (a>=0&&b>a&&t>0)?(b-a)*t:NaN;}const f=num(v.fat),p=num(v.pot);return (f>0&&p>f)?p-f:NaN;}
function calcText(v){const m=mesa(v);if(!(m>0))return "";if(v.calcMode==="ven"){const a=num(v.ven),b=num(v.vpot),t=num(v.tic);return `Olha só: vocês fazem ${a} vendas e a equipe de hoje aguenta até ${b}. São ${b-a} vendas a mais por mês, com ticket de ${brl(t)}. Isso dá ${brl(m)} por mês ficando na mesa, ${brl(m*12)} em um ano.`;}const f=num(v.fat),p=num(v.pot);return `Olha só: vocês faturam ${brl(f)} e a estrutura de hoje já aguenta até ${brl(p)}. São ${brl(m)} por mês ficando na mesa, ${brl(m*12)} em um ano. É ${Math.round(m/f*100)}% a mais do que vocês faturam hoje.`;}

  if(n.cap&&state==="current"){
    const l=el("label","cap",n.cap);const ta=el("textarea");ta.value=notes[id]||"";ta.placeholder="Registre a resposta do lead";
    ta.addEventListener("input",()=>{notes[id]=ta.value.trim();const sm=document.querySelector(".summary textarea");if(sm)sm.value=summary();});
    l.appendChild(ta);c.appendChild(l);
  }
  return c;
}
function render(){
  if(N[cur].dor)dor=N[cur].dor;
  const t=$("tree");t.innerHTML="";
  hist.forEach((h,i)=>{
    const n=N[h.node];
    t.appendChild(card(h.node,"past",h.dor,h.vars));
    const pos=xs(n.o.length);
    const ci=n.o.findIndex(o=>o[0]===h.a);
    const multi=n.o.length>2;
    if(n.o.length>=2){
      t.appendChild(wire(multi?[["M50 0 V26","w-on"]]:pos.map((x,k)=>[`M50 0 V10 H${x} V26`,k===ci?"w-on":"w-off"])));
      const row=el("div","branches two");
      n.o.forEach(([label,to,kind,set],k)=>{
        const b=el("button","br "+(k===ci?"chosen "+(kind||""):"other"));
        b.appendChild(el("span","lbl",label));
        b.appendChild(el("span","to",k===ci?"✓ escolhido":(multi?"trocar para esta":"ir por aqui: "+dest(to))));
        if(k!==ci)b.addEventListener("click",()=>{hist=hist.slice(0,i);cur=h.node;dor=h.dor;vars={...h.vars};go(label,to,set);});
        else b.disabled=true;
        row.appendChild(b);
      });
      t.appendChild(row);
      t.appendChild(wire([[multi?"M50 0 V26":`M${pos[ci]} 0 V10 H50 V26`,"w-on"]]));
    } else {
      t.appendChild(wire([["M50 0 V26","w-on"]]));
    }
  });
  const n=N[cur];
  const live=el("div","live grow");
  live.appendChild(card(cur,"current",dor));
  if(n.end){
    const s=el("div","summary");
    const ta=el("textarea");ta.readOnly=true;ta.value=summary();
    const cp=el("button","tool","Copiar resumo para o CRM");
    cp.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(ta.value);cp.textContent="Resumo copiado";}catch(e){ta.select();cp.textContent="Selecionado, copie com Ctrl+C";}});
    const nv=el("button","tool","Nova ligação");nv.style.marginLeft="8px";nv.addEventListener("click",restart);
    s.append(ta,cp,nv);live.appendChild(s);
  } else {
    const pos=xs(n.o.length);
    live.appendChild(wire(n.o.length>2?[["M50 0 V26","w-idle"]]:pos.map(x=>[`M50 0 V10 H${x} V26`,"w-idle"])));
    const row=el("div","branches"+(n.o.length>=2?" two":"")+(n.o.length>2?" multi":""));
    n.o.forEach(([label,to,kind,set],k)=>{
      const b=el("button","br "+(kind||""));
      b.appendChild(el("span","lbl",label));
      if(n.o.length===2)b.appendChild(el("span","to",dest(to)));
      {const ex=EX[cur]&&EX[cur][label];if(ex)b.appendChild(el("span","ex","“"+ex+"”"));}
      b.addEventListener("click",()=>go(label,to,set));
      row.appendChild(b);
    });
    live.appendChild(row);
  }
  t.appendChild(live);
  $("back").disabled=!hist.length;
  $("noanswer").disabled=cur!=="abertura"||hist.length>0;
  $("reception").disabled=cur!=="abertura"||hist.length>0;
}
function summary(){
  const L=[`Lead: ${$("nome").value.trim()||"-"} | Empresa: ${$("empresa").value.trim()||"-"}`];
  [...hist.map(h=>h.node),cur].forEach(id=>{const n=N[id];
    if(n.cap&&notes[id])L.push(`${n.cap}: ${notes[id]}`);
    const h=hist.find(x=>x.node===id);
    if(h&&n.o&&n.o.length>=2)L.push(`${shortQ[id]||id}: ${h.a}`);});
  if(vars.dorEsc)L.push("Dor: "+vars.dorEsc);
  if(vars.tempo)L.push("Há quanto tempo: "+vars.tempo);
  if(vars.tentou)L.push("Tentativas: "+vars.tentou+(vars.falhou?" ("+vars.falhou+")":""));
  if(vars.impl)L.push("Implicação: "+vars.impl);
  if(vars.calcMode==="ven"){if(vars.ven)L.push("Vendas por mês: "+vars.ven);if(vars.vpot)L.push("Vendas possíveis com a equipe atual: "+vars.vpot);if(vars.tic)L.push("Ticket médio: "+vars.tic);}
  else{if(vars.fat)L.push("Faturamento mensal: "+vars.fat);if(vars.pot)L.push("Potencial com a estrutura atual: "+vars.pot);}
  if(vars.custo)L.push("Dinheiro na mesa: "+vars.custo+" por mês ("+brl(mesa(vars)*12)+" por ano)");
  if(vars.pessoal)L.push("Impacto pessoal: "+vars.pessoal);
  if(vars.nec)L.push("Necessidade: "+vars.nec);
  const res=[...hist.map(h=>h.to),cur].map(x=>N[x]&&N[x].res).filter(Boolean);
  if(res.length)L.push("Resultado: "+res.map(r=>r[0]).join(" > "));
  return L.join("\n");
}
function go(label,to,set){hist.push({node:cur,a:label,to,dor,vars:{...vars}});if(set)Object.assign(vars,set);if(to[0]==="@")to=vars[to.slice(1)];hist[hist.length-1].to=to;cur=to;render();const live=document.querySelector(".live");requestAnimationFrame(()=>live.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}));}
function back(){if(!hist.length)return;const h=hist.pop();cur=h.node;dor=h.dor;vars={...h.vars};render();}
function restart(){hist=[];notes={};vars={};cur="abertura";dor="[dor]";render();window.scrollTo({top:0});}
$("back").onclick=back;$("restart").onclick=restart;
$("noanswer").onclick=()=>{cur="naoatendeu";render();};
$("reception").onclick=()=>{cur="portaria";render();};
["nome","empresa"].forEach(id=>$(id).addEventListener("input",render));
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  const b=[...document.querySelectorAll(".live .br")];
  const k=e.key.toLowerCase();
  if(k==="s"){const y=b.find(x=>x.classList.contains("yes"));if(y)y.click();}
  else if(k==="n"){const y=b.find(x=>x.classList.contains("no"));if(y)y.click();}
  else if(e.key==="Enter"&&b.length===1){b[0].click();}
  else if(/^[1-4]$/.test(e.key)&&b.length>2&&b[+e.key-1]){b[+e.key-1].click();}
  else if(e.key==="ArrowLeft"){back();}
});
render();
</script>
</body>
</html>
